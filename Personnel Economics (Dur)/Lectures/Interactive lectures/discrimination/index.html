<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discrimination · Chapter 16 · Interactive lecture</title><script src="../assets/vendor/hyperframes-player.global.js"></script><script src="../assets/vendor/hyperframes-slideshow.global.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172d36}hyperframes-slideshow{display:block;position:relative;width:100vw;height:100vh}hyperframes-player{position:absolute;inset:0}</style></head><body><hyperframes-slideshow tabindex="0"><hyperframes-player interactive src="composition.html"></hyperframes-player><script type="application/hyperframes-slideshow+json">{"slides":[{"sceneId":"root","notes":"A full lecture for Topic 7. Work through the interactive labs before the practice questions. Source: Kuhn ch16, PDF281–301."},{"sceneId":"discrimination-2","notes":"Kuhn16.1, PDF281–283. Distinguish descriptive disparity from identification of a discriminatory mechanism. An economic definition does not settle a legal or ethical question."},{"sceneId":"discrimination-3","notes":"Illustrative pipeline extending ch16. Ask which stage is observed and which applicants disappear from the data. Conditioning on being hired can conceal discrimination in hiring."},{"sceneId":"discrimination-4","notes":"Kuhn16.1, PDF283–287. Several mechanisms can operate together. This taxonomy organizes an explanation; it is not a diagnostic test by itself."},{"sceneId":"discrimination-5","notes":"Illustrative Becker-style taste model, consistent with Kuhn16.1. t is a preference cost in money-equivalent units, not an actual wage payment."},{"sceneId":"discrimination-6","notes":"Drag the marked point or use the slider. The line is an illustrative decision model, not estimated data. At t=20 the employer is indifferent."},{"sceneId":"discrimination-7","notes":"Kuhn16.2, PDF287–290. Competition is a conditional mechanism, not a claim that discrimination must disappear."},{"sceneId":"discrimination-8","notes":"Kuhn16.1–16.2. Private profit and social desirability are separate criteria. Do not call all prejudice a purely subjective employer cost."},{"sceneId":"discrimination-9","notes":"Illustrative Bayesian linear prediction. Assumes a normal prior and unbiased normal signal with independent noise; λ = prior variance / (prior variance + signal-noise variance). Kuhn16.1, PDF284–286."},{"sceneId":"discrimination-10","notes":"All numbers constructed for teaching. A better individual signal reduces prior weight under this specific model. This is not a universal prediction for every statistical discrimination model."},{"sceneId":"discrimination-11","notes":"Graph holds the common signal at80 and group means at60 and70. Move λ along the horizontal axis."},{"sceneId":"discrimination-12","notes":"Kuhn16.1–16.2, PDF285–289. Accurate inference and biased expectations are analytically distinct even if both produce a hiring gap."},{"sceneId":"discrimination-13","notes":"Illustrative investment threshold: p is probability that training is rewarded; B is reward; c is cost. Kuhn16.2, PDF288–289. The loop is possible, not inevitable."},{"sceneId":"discrimination-14","notes":"Constructed example holding training technology and ability fixed. It isolates an incentive channel; psychological effects are an additional channel."},{"sceneId":"discrimination-15","notes":"Kuhn16.2, PDF288–289. Avoid interpreting every later productivity difference as a pre-existing trait."},{"sceneId":"discrimination-16","notes":"Kuhn16.1, PDF282–286. A name can signal multiple perceived attributes; the treatment effect alone does not uniquely identify taste, beliefs, or attention."},{"sceneId":"discrimination-17","notes":"Teaching rates are illustrative. Bertrand and Mullainathan’s name-based audit, discussed by Kuhn, found roughly50% more callbacks for white-sounding names. Do not present these constructed12% and8% rates as er whether a productivity advantage is outweighed by co-worker morale effects; then discuss why a private-profit calculation alone is insufficient for evaluating discrimination."},{"sceneId":"discrimination-29","notes":"Read ch16PDF281–301. No direct discrimination question was found in the six local past papers; these practice prompts are textbook-based and constructed, not claimed exam questions."}],"slideSequences":[]}</script></hyperframes-slideshow></body></html>
