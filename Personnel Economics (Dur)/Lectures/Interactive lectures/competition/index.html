<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Competition in the workplace · Chapters 20–23 · Interactive lecture</title><script src="../assets/vendor/hyperframes-player.global.js"></script><script src="../assets/vendor/hyperframes-slideshow.global.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172d36}hyperframes-slideshow{display:block;position:relative;width:100vw;height:100vh}hyperframes-player{position:absolute;inset:0}</style></head><body><hyperframes-slideshow tabindex="0"><hyperframes-player interactive src="composition.html"></hyperframes-player><script type="application/hyperframes-slideshow+json">{"slides":[{"sceneId":"root","notes":"Topic8. Kuhn20PDF364–389;21PDF390–410;22PDF411–435;23PDF436–447. A full lecture with interactive comparative statics and a worked past-exam problem."},{"sceneId":"competition-2","notes":"Kuhn20.1PDF364–366. S is the prize spread; a is loser pay. The prize need not equal the winner’s current marginal product."},{"sceneId":"competition-3","notes":"Kuhn20.1 and22.1. These definitions are central to distinguishing biased rules from ability differences."},{"sceneId":"competition-4","notes":"Kuhn20.1–20.2PDF364–369. Keep expected output dE separate from realized output. Luck shocks are exogenous."},{"sceneId":"competition-5","notes":"Kuhn20.2. R here is the width of relative luck, not revenue. The formula is local/interior; outside the support probability must be0 or1."},{"sceneId":"competition-6","notes":"Use the sliders and drag the probability marker. Dashed line marks rival effort. The plotted clipped probability is globally valid; a first-order condition using its slope only applies in its interior."},{"sceneId":"competition-7","notes":"Kuhn20.3–20.4PDF369–372. Risk neutrality lets us use expected money minus money-equivalent effort cost."},{"sceneId":"competition-8","notes":"Kuhn20.3. With probability bounds, check boundary/global alternatives too. Constant marginal winning probability is special to uniform relative luck; general models depend on the effort gap."},{"sceneId":"competition-9","notes":"Kuhn20.6PDF373–375. Firm expected profit per worker16−14=2. Equal effort gives each worker a50% chance, although incentives induce substantial effort."},{"sceneId":"competition-10","notes":"Rival effort is fixed in this best-response lab. At kinks or saturation, inspect the true maximum rather than extrapolating the linear FOC. The numerical maximum is found on a fine grid and is labeled approximate."},{"sceneId":"competition-11","notes":"Kuhn20.4PDF370–372. Assumes no externalities, risk costs, or sabotage. Payments cancel when profit and worker utility are added."},{"sceneId":"competition-12","notes":"Kuhn20.4–20.5. A less precise contest needs a larger spread in this simple interior implementation. R means the relative-luck range."},{"sceneId":"competition-13","notes":"Kuhn20.4–20.6. a may be negative in the unconstrained model. Limited liability or minimum wages would add constraints; those are extensions, not included in this formula."},{"sceneId":"competition-14","notes":"Kuhn20.6. Equivalence depends on risk neutrality and the model’s assumptions; output measurement, strategic effects, and risk can break it."},{"sceneId":"competition-15","notes":"Kuhn20.8PDF380–385. Common-shock insurance is a benefit of relative evaluation; the rival’s idiosyncratic luck adds another source of risk."},{"sceneId":"competition-16","notes":"Kuhn20.7PDF375–380. This is a schematic dynamic incentive expression, not a full solved promotion model."},{"sceneId":"competition-17","notes":"Kuhn20.9PDF385–387. Connect the evidence to common shocks and selection of comparison pools, rather than assuming all relative contracts work."},{"sceneId":"competition-18","notes":"Kuhn21.1PDF390–399. Directed sabotage targets competitors likely to beat you. Productive effort and ranking manipulation are different activities."},{"sceneId":"competition-19","notes":"Constructed extension, not a formula quoted from Kuhn. Assumes a locally linear winning probability and additive score damage. Sabotage can destroy output or only misreport it; distinguish the two."},{"sceneId":"competition-20","notes":"Kuhn21.1; Carpenter et al.2010. Discussed findings are specific to the experiment. Do not interpret every tournament as lowering output."},{"sceneId":"competition-21","notes":"Uses Kuhn21.1 accounting formulas with illustrative numbers. Worker utility need not rise for arbitrary values; the textbook’s actual experiment had a worker-utility gain. Here it falls, showing the sign depends on parameters."},{"sceneId":"competition-22","notes":"Kuhn21.1. These choices can also weaken productive incentives, so compare the net effect. Peer reports about cooperation can themselves be strategic."},{"sceneId":"competition-23","notes":"Kuhn21.2PDF399–403. Distinguish cooperation in production from collusion against the employer."},{"sceneId":"competition-24","notes":"Kuhn21.2; Bandiera et al.2005. The design and monitoring variation help distinguish collusion from altruism. Remedies include reshuffling, larger groups, and confidential performance information."},{"sceneId":"competition-25","notes":"Illustrative normal-noise model for Kuhn21.3PDF404–407. dp/dσ has the opposite sign to Δ. This holds the mean gap fixed; risk actions can also change expected output."},{"sceneId":"competition-26","notes":"Constructed normal model. Drag σ and adjust the mean gap. The graph does not claim that all workplace risks are normally distributed."},{"sceneId":"competition-27","notes":"Kuhn22.1PDF411–414. With uniform noise the interior slope is constant, so asymmetry need not reduce incentives until a boundary matters. Smooth-noise models clarify the general mechanism."},{"sceneId":"competition-28","notes":"Illustrative normal-noise extension. Treat Δ as a pre-effort or fixed comparison gap; this graph is a local incentive calculation, not a solved asymmetric equilibrium."},{"sceneId":"competition-29","notes":"Kuhn22.2PDF414–417; Brown2011. The local Markdown result contains an apparent reversed wording; the surrounding discussion supports worse performance when Woods was present. Treat the study as evidence in context, not a universal law."},{"sceneId":"competition-30","notes":"Kuhn22.3PDF417–421. “Fair” here means rules select the best measured performance. A handicap can be useful for incentives while violating that narrow rule definition."},{"sceneId":"competition-31","notes":"Kuhn22.3–22.4. Handicapping need not imply promoting an unqualified person; rewards and job assignment can be separated."},{"sceneId":"competition-32","notes":"Kuhn22.4PDF421–425, Result22.6. This is a particular symmetric-ignorance model, not a general rule for every promotion ladder."},{"sceneId":"competition-33","notes":"Kuhn22.4PDF425–427; Meyer1991, Result22.7. Identify the objective and information constraint before applying a fairness result."},{"sceneId":"competition-34","notes":"Kuhn22.4PDF427–429, Result22.8. Market-based rewards differ from prizes fully controlled by the current employer."},{"sceneId":"competition-35","notes":"Kuhn22.4PDF429–432, Result22.9; Stracke and Sunde2014. Compare both stages, not only the final."},{"sceneId":"competition-36","notes":"Kuhn23.1PDF436–439. Common shocks can make relative pay attractive to risk-averse people, while idiosyncratic rival risk can deter entry."},{"sceneId":"competition-37","notes":"Constructed example: perceived18 versus actual9. It separates beliefs from actual performance, holding effort and nonmonetary preferences constant."},{"sceneId":"competition-38","notes":"Illustrative mean–variance approximation with0/S prizes. ρ is absolute risk aversion; the formula is an approximation, not exact utility for arbitrary risk. Common-shock insurance is omitted here."},{"sceneId":"competition-39","notes":"Kuhn23.1, Leuven et al.2011. This is an organizing decomposition, not an identified equation without a research design."},{"sceneId":"competition-40","notes":"Kuhn23.2PDF439–445; Niederle and Vesterlund2007. Findings concern study populations and settings, not fixed traits of individuals."},{"sceneId":"competition-41","notes":"Kuhn23.2. The textbook discusses Wozniak et al.2014 and Gneezy et al.2009. Avoid applying population averages to an individual hiring decision."},{"sceneId":"competition-42","notes":"Actual local Final2025Q3, PDF7–8,10points. Revenue per output unit is R in this exam, unlike Kuhn’s noise-range R. Use π for probability sensitivity."},{"sceneId":"competition-43","notes":"F25Q3a,2points. First derivativeπ(Z+P)−θe=0; second derivative−θ<0. Linear probability is an interior model."},{"sceneId":"competition-44","notes":"F25Q3b,3points. Substitute e=π(Z+P)/θ if expressing W only in parameters. Do not use V once when the outside option is available in both periods."},{"sceneId":"competition-45","notes":"F25Q3d,3points. Let A=Z+P: Π=2RπA/θ−π²A²/θ−4V+P; FOC gives A=R/π. This solution assumes an interior feasible contract."},{"sceneId":"competition-46","notes":"Constructed numerical example applied to the actual exam model. Each worker’s costθe²/2=9; totalbasepay4W=10. At these values the probability boundaries do not invalidate the equilibrium optimum."},{"sceneId":"competition-47","notes":"F25Q3c requires a verbal explanation of both utility and cost channels. The comparative statics after optimizing Z are a separate observation. If Z≥0 binds, the interior result changes."},{"sceneId":"competition-48","notes":"Answers: ranking can reward harm and undermine cooperation; monitoring and enforcement are easier in small repeated groups; option value and informative upsets can change early incentives. KuhnDQ21.3 and22.4 motivate the latter prompts."},{"sceneId":"competition-49","notes":"Formula checklist: E=αdS; E*=d; S*=1/α; basepay from participation; exam e=π(Z+P)/θ and Z*=R/π−P. Textbook pages and the actual exam are recorded in the source guide."}],"slideSequences":[]}</script></hyperframes-slideshow></body></html>
