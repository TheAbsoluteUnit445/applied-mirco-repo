<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Efficient investment and financing cost</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f3e9;color:#172d32;font-family:system-ui,sans-serif}#root{width:100%;height:100%;position:relative}.card{position:absolute;inset:0;padding:32px 60px}h1{font-size:48px;line-height:1.1;margin:0 0 18px}.graph{display:block;background:white;border:2px solid #c9d5d0;width:100%;height:550px}.legend{font-size:27px;line-height:1.3;margin:16px 0}.controls{display:flex;gap:28px;align-items:center;flex-wrap:wrap;font-size:27px}.controls label{display:flex;flex-direction:column;flex:1;min-width:350px}.controls input{width:100%;height:30px;accent-color:#076760}button{font:inherit;padding:10px 20px;border:2px solid #076760;background:#e2eee9;color:#172d32;border-radius:8px;cursor:pointer}.result{font-size:29px;line-height:1.35;margin:20px 0}input:focus-visible,button:focus-visible{outline:4px solid #945209;outline-offset:4px}footer{font-size:22px;color:#076760;position:absolute;bottom:15px;left:60px}</style><script src="vendor/gsap.min.js"></script></head><body>
<div id="root" data-composition-id="root" data-no-timeline data-start="0" data-duration="10" data-width="1600" data-height="1000"><section id="graph-card" class="card"><div class="inner"><h1>Efficient investment and financing cost</h1><div data-widget="investment-mb"><svg class="graph" viewBox="0 0 850 455" role="img" aria-label="Efficient investment and financing cost"></svg><p class="legend"></p><div class="controls"></div><p class="result" aria-live="polite"></p></div></div><footer>Week 7 · Original course values, except the labelled financing example · Full reasoning in the walkthrough</footer></section></div>
<script>/* Original Lecture 7 / tutorial values unless a graph explicitly says teaching example.
   The user owns sliders; they never advance the slideshow timeline. */
(()=>{
const N='http://www.w3.org/2000/svg',C=['#076760','#365faf','#945209'];
const specs={
 'financing':{x:[0,120],y:[0,65],axes:['Public spending G','Own tax payment'],controls:[['G','Spending G',0,120,1,60]],legend:'Teaching incomes 20, 40, 60; teal: Poor, blue: Middle, gold: Rich.',calc(v){return{lines:[x=>x/6,x=>x/3,x=>x/2],points:[[v.G,v.G/6],[v.G,v.G/3],[v.G,v.G/2]],text:`G = ${v.G}; taxes ${f(v.G/6)}, ${f(v.G/3)}, ${f(v.G/2)}; total ${f(v.G)}. Extra-euro shares: 1/6, 1/3, 1/2.`}}},
 'investment-mb':{x:[1,250],y:[0,3],axes:['Investment I (million euros)','Marginal benefit / cost'],controls:[['I','Inspect investment I',1,250,1,100],['mcpf','MCPF',1,2,.1,1]],legend:'Lecture pp.28–29. Teal: summed MB = 10/√I; blue: marginal financing cost.',calc(v){const opt=(10/v.mcpf)**2;return{lines:[x=>10/Math.sqrt(x),x=>v.mcpf],points:[[opt,v.mcpf],[v.I,10/Math.sqrt(v.I)]],vertical:opt,text:`Optimal I = ${f(opt)}. At I = ${v.I}, MB ${f(10/Math.sqrt(v.I))} ${10/Math.sqrt(v.I)>v.mcpf+1e-8?'>':10/Math.sqrt(v.I)<v.mcpf-1e-8?'<':'='} cost ${f(v.mcpf)}. Increase I while MB > cost.`}}},
 'investment-peaks':{x:[0,1000],y:[-450,180],axes:['Investment I (million euros)','Net utility'],controls:[['I','Inspect investment I',0,1000,1,81]],legend:'Lecture p.30. Teal: Rich; blue: Middle; gold: Poor. Fixed incomes omitted. Peaks 16, 81, 900.',calc(v){const funcs=[x=>4*Math.sqrt(x)-x/2,x=>6*Math.sqrt(x)-x/3,x=>10*Math.sqrt(x)-x/6];return{lines:funcs,points:[16,81,900].map((x,i)=>[x,funcs[i](x)]),vertical:v.I,text:`At I = ${v.I}: Rich ${f(funcs[0](v.I))}, Middle ${f(funcs[1](v.I))}, Poor ${f(funcs[2](v.I))}. Median peak = 81; efficient I = 100.`}}},
 'weighted-welfare':{x:[0,450],y:[-40,440],axes:['Investment I (million euros)','Net welfare / surplus'],controls:[['weight','Poor welfare weight w',1,4,.25,3]],legend:'Lecture p.31 extension. Teal: weighted welfare; blue: unweighted surplus. Fixed incomes omitted.',calc(v){const cost=(5+v.weight)/6,benefit=10*(1+v.weight),opt=(benefit/(2*cost))**2;const a=x=>benefit*Math.sqrt(x)-cost*x;return{lines:[a,x=>20*Math.sqrt(x)-x],points:[[opt,a(opt)],[100,100]],vertical:opt,text:`w = ${f(v.weight)}; weighted cost coefficient ${f(cost)}; benefit coefficient ${f(benefit)}. Weighted optimum I = ${f(opt)}. Votes still select 81.`}}},
 'beach-election':{x:[0,1],y:[-1,.05],axes:['Citizen ideal beach size (miles)','Utility from each platform'],controls:[['red','Red platform',0,1,.01,.3],['brown','Brown platform',0,1,.01,.8]],legend:'Exercise 7.3: uniform voter ideals, credible promises. Teal: Red; blue: Brown.',calc(v){const dR=Math.abs(v.red-.5),dB=Math.abs(v.brown-.5),tie=Math.abs(dR-dB)<1e-8,share=Math.abs(v.red-v.brown)<1e-8?.5:v.red<v.brown?(v.red+v.brown)/2:1-(v.red+v.brown)/2;return{lines:[x=>-Math.abs(x-v.red),x=>-Math.abs(x-v.brown)],points:[[.5,-dR],[.5,-dB]],vertical:.5,text:`Red vote share ${(100*share).toFixed(1)}%; winning probability ${tie?'½':dR<dB?'1':'0'} (fair tie-break). ${tie?'Tie':dR<dB?'Red wins':'Brown wins'}. Vote share differs from win probability.`}}},
 'cleaning':{x:[0,22],y:[0,125],axes:['Total cleaning H (hours)','Marginal benefit / cost (euros)'],controls:[['H','Inspect cleaning H',0,22,.25,16]],legend:'Exercise 7.4. Teal: total MB; blue: David MB; gold: full marginal cost 12.',calc(v){return{lines:[x=>120-6*x,x=>60-3*x,x=>12],points:[[18,12],[16,12]],vertical:v.H,text:`At H = ${f(v.H)}: total MB ${f(120-6*v.H)}; David MB ${f(60-3*v.H)}. Efficient H = 18; voluntary H = 16; shared-cost majority H = 18.`}}}
};
function f(x){return x.toFixed(2)}
function mount(host){const spec=specs[host.dataset.widget];if(!spec)return;let values=Object.fromEntries(spec.controls.map(c=>[c[0],c[5]]));const svg=host.querySelector('svg'),controls=host.querySelector('.controls'),result=host.querySelector('.result');host.querySelector('.legend').textContent=spec.legend;let inputs={};
for(const [key,label,min,max,step,initial] of spec.controls){let wrap=document.createElement('label'),caption=document.createElement('span'),input=document.createElement('input');input.type='range';Object.assign(input,{min,max,step,value:initial});input.setAttribute('aria-label',label);wrap.append(caption,input);controls.append(wrap);inputs[key]={input,caption,label};input.addEventListener('input',()=>{values[key]=+input.value;draw()});input.addEventListener('keydown',e=>e.stopPropagation());}
let reset=document.createElement('button');reset.textContent='Reset graph';reset.onclick=()=>{for(const c of spec.controls){values[c[0]]=c[5];inputs[c[0]].input.value=c[5]}draw()};controls.append(reset);
function draw(){const d=spec.calc(values);svg.replaceChildren();let [x0,x1]=spec.x,[y0,y1]=spec.y;const sx=x=>120+(x-x0)/(x1-x0)*650,sy=y=>330-(y-y0)/(y1-y0)*280;
function el(tag,attrs,text){let e=document.createElementNS(N,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;svg.append(e);return e}
for(let i=0;i<5;i++){let x=x0+(x1-x0)*i/4,y=y0+(y1-y0)*i/4;el('line',{x1:sx(x),x2:sx(x),y1:50,y2:330,stroke:'#dfe6e3'});el('line',{x1:120,x2:770,y1:sy(y),y2:sy(y),stroke:'#dfe6e3'});el('text',{x:sx(x),y:370,'text-anchor':'middle','font-size':30,fill:'#172d32'},+x.toFixed(2));el('text',{x:108,y:sy(y)+10,'text-anchor':'end','font-size':30,fill:'#172d32'},+y.toFixed(2));}
el('text',{x:450,y:420,'text-anchor':'middle','font-size':30,fill:'#172d32'},spec.axes[0]);el('text',{x:28,y:200,transform:'rotate(-90 28 200)','text-anchor':'middle','font-size':27,fill:'#172d32'},spec.axes[1]);
d.lines.forEach((fn,j)=>{let path=[],on=false;for(let i=0;i<=400;i++){let x=x0+(x1-x0)*i/400,y=fn(x);if(y<y0||y>y1||!Number.isFinite(y)){on=false;continue}path.push((on?'L':'M')+sx(x)+','+sy(y));on=true}el('path',{d:path.join(' '),stroke:C[j],fill:'none','stroke-width':5})});
if(d.vertical!==undefined)el('line',{x1:sx(d.vertical),x2:sx(d.vertical),y1:50,y2:330,stroke:'#172d32','stroke-dasharray':'8 6','stroke-width':3});d.points.forEach(([x,y],i)=>el('circle',{cx:sx(x),cy:sy(y),r:8,fill:C[i%3],stroke:'white','stroke-width':2}));
for(const[k,o]of Object.entries(inputs))o.caption.textContent=o.label+' = '+f(values[k]);result.textContent=d.text;host.dataset.values=JSON.stringify(values);host.dataset.graphResult=JSON.stringify(d.points);}
draw();}
document.querySelectorAll('[data-widget]').forEach(mount);window.week7GraphSpecs=specs;
})();
</script><script>window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});tl.fromTo('.inner',{opacity:1},{opacity:1,duration:10,ease:'none'});window.__timelines.root=tl;</script></body></html>
