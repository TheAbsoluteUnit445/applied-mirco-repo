  :host {
    display: block;
    position: relative;
    overflow: hidden;
    background: #000;
    contain: layout style;
  }

  .hfp-container {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }


  .hfp-iframe {
    position: absolute;
    top: 50%;
    left: 50%;
    border: none;
    pointer-events: none;
  }

  /* Opt-in: an interactive composition (e.g. a live slideshow/app with playable
     media or controls) \u2014 let pointer events reach the iframe content. */
  :host([interactive]) .hfp-container,
  :host([interactive]) .hfp-iframe {
    pointer-events: auto;
  }

  .hfp-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
  }

  .hfp-poster {
    position: absolute;
    inset: 0;
    object-fit: contain;
    z-index: 1;
    pointer-events: none;
  }

  .hfp-shader-loader {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: #030504;
    color: #f4f7fb;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
    transition: opacity 420ms ease-out, visibility 420ms ease-out;
  }

  .hfp-shader-loader.hfp-visible,
  .hfp-shader-loader.hfp-hiding {
    visibility: visible;
  }

  .hfp-shader-loader.hfp-visible {
    opacity: 1;
    pointer-events: auto;
  }

  .hfp-shader-loader.hfp-hiding {
    opacity: 0;
    pointer-events: none;
  }

  .hfp-shader-loader-panel {
    display: grid;
    grid-template-rows: 86px 40px 26px 12px 44px;
    justify-items: center;
    align-items: center;
    gap: 8px;
    width: min(620px, 82%);
    text-align: center;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .hfp-shader-loader-mark {
    width: 86px;
    height: 86px;
    display: grid;
    place-items: center;
    overflow: visible;
  }

  .hfp-shader-loader-mark svg {
    display: block;
    overflow: visible;
    filter: drop-shadow(0 0 5px rgba(79, 219, 94, 0.16));
    pointer-events: none;
  }

  .hfp-shader-loader-title {
    width: 100%;
    height: 40px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 26px;
    line-height: 40px;
    font-weight: 700;
    letter-spacing: 0;
  }

  .hfp-shader-loader-title-text {
    color: transparent;
    background: linear-gradient(
      90deg,
      rgba(244, 247, 251, 0.84) 0%,
      #ffffff 42%,
      #80efe4 52%,
      #ffffff 62%,
      rgba(244, 247, 251, 0.84) 100%
    );
    background-size: 220% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    animation: hfp-shader-loader-sheen 1.9s linear infinite;
  }

  .hfp-shader-loader:not(.hfp-visible):not(.hfp-hiding) .hfp-shader-loader-title-text {
    animation-play-state: paused;
  }

  .hfp-shader-loader-detail {
    width: 100%;
    height: 26px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    color: rgba(244, 247, 251, 0.62);
    font-size: 15px;
    line-height: 26px;
    font-weight: 500;
  }

  .hfp-shader-loader-track {
    width: min(360px, 100%);
    height: 8px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
  }

  .hfp-shader-loader-fill {
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #06e3fa, #4fdb5e);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 160ms ease;
  }

  .hfp-shader-loader-progress {
    width: min(420px, 100%);
    height: 44px;
    display: grid;
    grid-template-rows: repeat(2, 22px);
    color: rgba(244, 247, 251, 0.48);
    font: 600 13px/22px "IBM Plex Mono", "SF Mono", "Fira Code", "Courier New", monospace;
    font-variant-numeric: tabular-nums;
  }

  .hfp-shader-loader-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 74px;
    align-items: center;
    column-gap: 20px;
    width: 100%;
    white-space: nowrap;
  }

  .hfp-shader-loader-label {
    min-width: 0;
    overflow: hidden;
    text-align: left;
    text-overflow: ellipsis;
  }

  .hfp-shader-loader-value {
    text-align: right;
  }

  @keyframes hfp-shader-loader-sheen {
    from {
      background-position: 140% 0;
    }
    to {
      background-position: -140% 0;
    }
  }

  /* \u2500\u2500 Theming via CSS custom properties \u2500\u2500
   *
   * Override from outside the shadow DOM:
   *   hyperframes-player {
   *     --hfp-controls-bg: linear-gradient(transparent, rgba(0,0,0,0.9));
   *     --hfp-accent: #ff6b6b;
   *     --hfp-font: "Inter", sans-serif;
   *   }
   */

  .hfp-controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    gap: var(--hfp-controls-gap, 12px);
    padding: var(--hfp-controls-padding, 8px 16px);
    background: var(--hfp-controls-bg, linear-gradient(transparent, rgba(0, 0, 0, 0.7)));
    color: var(--hfp-color, #fff);
    font-family: var(--hfp-font, system-ui, -apple-system, sans-serif);
    font-size: var(--hfp-font-size, 13px);
    z-index: 10;
    pointer-events: auto;
    opacity: 1;
    transition: opacity 0.3s ease;
    user-select: none;
  }

  .hfp-controls.hfp-hidden {
    opacity: 0;
    pointer-events: none;
  }

  .hfp-play-btn {
    position: relative;
    background: none;
    border: none;
    color: var(--hfp-color, #fff);
    cursor: pointer;
    padding: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    z-index: 10;
  }

  .hfp-play-btn:hover {
    opacity: 0.8;
  }

  /* Stacked play/pause glyphs that crossfade-morph on toggle (rotate + scale). */
  .hfp-play-btn .hfp-ico {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    transition:
      opacity 200ms ease,
      transform 220ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .hfp-play-btn .hfp-ico-play {
    opacity: 1;
    transform: rotate(0) scale(1);
  }
  .hfp-play-btn .hfp-ico-pause {
    opacity: 0;
    transform: rotate(-90deg) scale(0.4);
  }
  .hfp-play-btn.hfp-playing .hfp-ico-play {
    opacity: 0;
    transform: rotate(90deg) scale(0.4);
  }
  .hfp-play-btn.hfp-playing .hfp-ico-pause {
    opacity: 1;
    transform: rotate(0) scale(1);
  }
  @media (prefers-reduced-motion: reduce) {
    .hfp-play-btn .hfp-ico {
      transition-duration: 0ms;
      transform: none;
    }
  }

  .hfp-play-btn svg,
  .hfp-play-btn svg * {
    pointer-events: none;
  }

  .hfp-scrubber {
    flex: 1;
    min-width: 0;
    height: var(--hfp-scrubber-height, 4px);
    background: var(--hfp-scrubber-bg, rgba(255, 255, 255, 0.3));
    border-radius: var(--hfp-scrubber-radius, 2px);
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .hfp-scrubber:hover {
    height: var(--hfp-scrubber-height-hover, 6px);
  }

  .hfp-progress {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: var(--hfp-accent, #fff);
    pointer-events: none;
  }

  .hfp-time {
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    opacity: 0.9;
  }

  .hfp-speed-wrap {
    position: relative;
    flex-shrink: 0;
  }

  .hfp-speed-btn {
    background: var(--hfp-speed-btn-bg, rgba(255, 255, 255, 0.15));
    border: none;
    border-radius: var(--hfp-speed-btn-radius, 4px);
    color: var(--hfp-color, #fff);
    cursor: pointer;
    font-family: var(--hfp-font, system-ui, -apple-system, sans-serif);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    padding: 4px 8px;
    min-width: 40px;
    text-align: center;
    transition: background 0.15s ease;
  }

  .hfp-speed-btn:hover {
    background: var(--hfp-speed-btn-bg-hover, rgba(255, 255, 255, 0.3));
  }

  .hfp-speed-menu {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 0;
    background: var(--hfp-menu-bg, rgba(20, 20, 20, 0.95));
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--hfp-menu-border, rgba(255, 255, 255, 0.1));
    border-radius: var(--hfp-menu-radius, 8px);
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 80px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(4px);
    transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
    box-shadow: var(--hfp-menu-shadow, 0 8px 24px rgba(0, 0, 0, 0.4));
  }

  .hfp-speed-menu.hfp-open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .hfp-speed-option {
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--hfp-menu-color, rgba(255, 255, 255, 0.7));
    cursor: pointer;
    font-family: var(--hfp-font, system-ui, -apple-system, sans-serif);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    padding: 6px 12px;
    text-align: left;
    transition: background 0.1s ease, color 0.1s ease;
    white-space: nowrap;
  }

  .hfp-speed-option:hover {
    background: var(--hfp-menu-hover-bg, rgba(255, 255, 255, 0.1));
    color: var(--hfp-color, #fff);
  }

  .hfp-speed-option.hfp-active {
    color: var(--hfp-accent, #fff);
    font-weight: 600;
  }

  .hfp-volume-wrap {
    position: relative;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 0;
  }

  .hfp-mute-btn {
    background: none;
    border: none;
    color: var(--hfp-color, #fff);
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    flex-shrink: 0;
  }

  .hfp-mute-btn:hover {
    opacity: 0.8;
  }

  .hfp-mute-btn svg,
  .hfp-mute-btn svg * {
    pointer-events: none;
  }

  .hfp-volume-slider-wrap {
    width: 0;
    overflow: hidden;
    transition: width 0.2s ease;
    display: flex;
    align-items: center;
  }

  .hfp-volume-wrap:hover .hfp-volume-slider-wrap {
    width: 64px;
  }

  .hfp-volume-slider {
    width: 56px;
    height: var(--hfp-scrubber-height, 4px);
    background: var(--hfp-scrubber-bg, rgba(255, 255, 255, 0.3));
    border-radius: var(--hfp-scrubber-radius, 2px);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    margin-left: 4px;
    margin-right: 4px;
  }

  .hfp-volume-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: var(--hfp-accent, #fff);
    pointer-events: none;
  }

&lt;section id=&quot;root-content&quot; class=&quot;slide clip&quot; data-start=&quot;0&quot; data-duration=&quot;10&quot; data-track-index=&quot;1&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;Collective decision-making · 1/13&lt;/p&gt;&lt;h1&gt;Voting translates individual preferences into a collective choice.&lt;/h1&gt;
&lt;div class=&quot;content plain &quot;&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p data-reveal=&quot;2&quot;&gt;A political outcome is not automatically the outcome with greatest total benefit.&lt;/p&gt;&lt;p data-reveal=&quot;4&quot;&gt;Positive analysis explains the outcome. Normative analysis judges it using an explicit welfare criterion.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;footer class=&quot;source&quot;&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../Textbooks/Rosen%20%26%20Gayer%20-%20Public%20Finance%20%2810th%20ed%29.pdf#page=191&quot; title=&quot;R&amp;amp;G ch. 6 · PDF pp. 191–224&quot; target=&quot;_blank&quot;&gt;R&amp;amp;G ch. 6 · PDF pp. 191–224&lt;/a&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../study-packs/Upcoming%20lecture%20block/02-political-economy.html&quot; target=&quot;_blank&quot;&gt;Full notes + practice&lt;/a&gt;&lt;/footer&gt;&lt;/section&gt;&lt;div class=&quot;progress&quot; data-layout-ignore&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;scene&quot; id=&quot;politics-2&quot; data-composition-id=&quot;politics-2&quot; data-start=&quot;10&quot; data-duration=&quot;10&quot; data-width=&quot;1920&quot; data-height=&quot;1080&quot; data-label=&quot;Personalised Lindahl prices can make everyone agree on one public-good level.&quot;&gt;
&lt;section id=&quot;politics-2-content&quot; class=&quot;slide clip&quot; data-start=&quot;10&quot; data-duration=&quot;10&quot; data-track-index=&quot;2&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;Collective decision-making · 2/13&lt;/p&gt;&lt;h1&gt;Personalised Lindahl prices can make everyone agree on one public-good level.&lt;/h1&gt;
&lt;div class=&quot;content  &quot;&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;sₐ and sₑ are personal cost shares; MB is marginal willingness to pay and MC marginal rocket cost. Adam and Eve demand the same quantity at equilibrium shares.&lt;/p&gt;&lt;p&gt;Shares add to one. Strategic misreporting and costly agreement are practical obstacles.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;algebra&quot;&gt;&lt;div class=&quot;step&quot; data-reveal=&quot;12.0&quot;&gt;&lt;span data-math=&quot;s_A+s_E=1&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;step&quot; data-reveal=&quot;13.5&quot;&gt;&lt;span data-math=&quot;MB_A=s_A MC,\quad MB_E=s_E MC&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;step&quot; data-reveal=&quot;15.0&quot;&gt;&lt;span data-math=&quot;MB_A+MB_E=MC&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;footer class=&quot;source&quot;&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../Textbooks/Rosen%20%26%20Gayer%20-%20Public%20Finance%20%2810th%20ed%29.pdf#page=192&quot; title=&quot;R&amp;amp;G “Unanimity Rules” · PDF pp. 192–194&quot; target=&quot;_blank&quot;&gt;R&amp;amp;G · PDF pp. 192–194&lt;/a&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../study-packs/Upcoming%20lecture%20block/02-political-economy.html&quot; target=&quot;_blank&quot;&gt;Full notes + practice&lt;/a&gt;&lt;/footer&gt;&lt;/section&gt;&lt;div class=&quot;progress&quot; data-layout-ignore&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;scene&quot; id=&quot;politics-3&quot; data-composition-id=&quot;politics-3&quot; data-start=&quot;20&quot; data-duration=&quot;10&quot; data-width=&quot;1920&quot; data-height=&quot;1080&quot; data-label=&quot;Single-peaked preferences mean each voter has one best policy on an ordered line.&quot;&gt;
&lt;section id=&quot;politics-3-content&quot; class=&quot;slide clip&quot; data-start=&quot;20&quot; data-duration=&quot;10&quot; data-track-index=&quot;3&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;Collective decision-making · 3/13&lt;/p&gt;&lt;h1&gt;Single-peaked preferences mean each voter has one best policy on an ordered line.&lt;/h1&gt;
&lt;div class=&quot;content  &quot;&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;Moving away from that favourite in either direction makes the voter worse off.&lt;/p&gt;&lt;p&gt;Here m is policy spending, zᵢ voter i’s preferred spending, and Uᵢ utility. This constructed quadratic is symmetric; single-peaked preferences need not be symmetric.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;algebra&quot;&gt;&lt;div class=&quot;step&quot; data-reveal=&quot;22.0&quot;&gt;&lt;span data-math=&quot;U_i(m)=-(m-z_i)^2&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;step&quot; data-reveal=&quot;23.5&quot;&gt;&lt;span data-math=&quot;\frac{dU_i}{dm}=-2(m-z_i)=0\ \Rightarrow\ m=z_i&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;step&quot; data-reveal=&quot;25.0&quot;&gt;&lt;span data-math=&quot;\frac{d^2U_i}{dm^2}=-2&amp;lt;0&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;footer class=&quot;source&quot;&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../Textbooks/Rosen%20%26%20Gayer%20-%20Public%20Finance%20%2810th%20ed%29.pdf#page=196&quot; title=&quot;R&amp;amp;G “Single-Peaked Preferences” · PDF pp. 196–198&quot; target=&quot;_blank&quot;&gt;R&amp;amp;G · PDF pp. 196–198&lt;/a&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../study-packs/Upcoming%20lecture%20block/02-political-economy.html&quot; target=&quot;_blank&quot;&gt;Full notes + practice&lt;/a&gt;&lt;/footer&gt;&lt;/section&gt;&lt;div class=&quot;progress&quot; data-layout-ignore&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;scene&quot; id=&quot;politics-4&quot; data-composition-id=&quot;politics-4&quot; data-start=&quot;30&quot; data-duration=&quot;10&quot; data-width=&quot;1920&quot; data-height=&quot;1080&quot; data-label=&quot;The median ideal point defeats alternatives under the theorem’s assumptions.&quot;&gt;
&lt;section id=&quot;politics-4-content&quot; class=&quot;slide clip&quot; data-start=&quot;30&quot; data-duration=&quot;10&quot; data-track-index=&quot;4&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;Collective decision-making · 4/13&lt;/p&gt;&lt;h1&gt;The median ideal point defeats alternatives under the theorem’s assumptions.&lt;/h1&gt;
&lt;div class=&quot;content  has-graph&quot;&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;The graph uses three sincere voters with quadratic preferences on a single policy dimension.&lt;/p&gt;&lt;p&gt;Drag an ideal point or use its slider. The majority winner is the middle ideal point, not their arithmetic mean.&lt;/p&gt;&lt;/div&gt;&lt;div data-widget=&quot;median&quot;&gt;&lt;svg class=&quot;graph&quot; viewBox=&quot;0 0 850 455&quot; role=&quot;img&quot; aria-label=&quot;Interactive graph: median&quot;&gt;&lt;/svg&gt;&lt;p class=&quot;legend&quot;&gt;&lt;/p&gt;&lt;div class=&quot;controls&quot;&gt;&lt;/div&gt;&lt;p class=&quot;result&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;footer class=&quot;source&quot;&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../Textbooks/Rosen%20%26%20Gayer%20-%20Public%20Finance%20%2810th%20ed%29.pdf#page=198&quot; title=&quot;R&amp;amp;G “The Median Voter Theorem” · PDF pp. 198–199&quot; target=&quot;_blank&quot;&gt;R&amp;amp;G · PDF pp. 198–199&lt;/a&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../study-packs/Upcoming%20lecture%20block/02-political-economy.html&quot; target=&quot;_blank&quot;&gt;Full notes + practice&lt;/a&gt;&lt;/footer&gt;&lt;/section&gt;&lt;div class=&quot;progress&quot; data-layout-ignore&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;scene&quot; id=&quot;politics-5&quot; data-composition-id=&quot;politics-5&quot; data-start=&quot;40&quot; data-duration=&quot;10&quot; data-width=&quot;1920&quot; data-height=&quot;1080&quot; data-label=&quot;The median result does not establish efficient public expenditure.&quot;&gt;
&lt;section id=&quot;politics-5-content&quot; class=&quot;slide clip&quot; data-start=&quot;40&quot; data-duration=&quot;10&quot; data-track-index=&quot;5&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;Collective decision-making · 5/13&lt;/p&gt;&lt;h1&gt;The median result does not establish efficient public expenditure.&lt;/h1&gt;
&lt;div class=&quot;content  &quot;&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;A vote records which alternative someone prefers, not how strongly they prefer it.&lt;/p&gt;&lt;p&gt;Here MBᵢ is voter i’s marginal willingness to pay and MC the marginal resource cost. Efficient spending equates their sum with cost; median spending may differ.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;algebra&quot;&gt;&lt;div class=&quot;step&quot; data-reveal=&quot;42.0&quot;&gt;&lt;span data-math=&quot;\text{Voting: median preferred }m&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;step&quot; data-reveal=&quot;43.5&quot;&gt;&lt;span data-math=&quot;\text{Efficiency: }\sum_i MB_i(m)=MC(m)&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;footer class=&quot;source&quot;&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../Textbooks/Rosen%20%26%20Gayer%20-%20Public%20Finance%20%2810th%20ed%29.pdf#page=198&quot; title=&quot;R&amp;amp;G “The Median Voter Theorem” · PDF pp. 198–199&quot; target=&quot;_blank&quot;&gt;R&amp;amp;G · PDF pp. 198–199&lt;/a&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../study-packs/Upcoming%20lecture%20block/02-political-economy.html&quot; target=&quot;_blank&quot;&gt;Full notes + practice&lt;/a&gt;&lt;/footer&gt;&lt;/section&gt;&lt;div class=&quot;progress&quot; data-layout-ignore&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;scene&quot; id=&quot;politics-6&quot; data-composition-id=&quot;politics-6&quot; data-start=&quot;50&quot; data-duration=&quot;10&quot; data-width=&quot;1920&quot; data-height=&quot;1080&quot; data-label=&quot;A voting cycle lets the agenda determine which outcome wins.&quot;&gt;
&lt;section id=&quot;politics-6-content&quot; class=&quot;slide clip&quot; data-start=&quot;50&quot; data-duration=&quot;10&quot; data-track-index=&quot;6&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;Collective decision-making · 6/13&lt;/p&gt;&lt;h1&gt;A voting cycle lets the agenda determine which outcome wins.&lt;/h1&gt;
&lt;div class=&quot;content  &quot;&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;Constructed rankings: A &amp;gt; B &amp;gt; C; B &amp;gt; C &amp;gt; A; C &amp;gt; A &amp;gt; B.&lt;/p&gt;&lt;p&gt;A beats B, B beats C, and C beats A by 2–1. There is no alternative that beats every rival.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;algebra&quot;&gt;&lt;div class=&quot;step&quot; data-reveal=&quot;52.0&quot;&gt;&lt;span data-math=&quot;A\succ B,\quad B\succ C,\quad C\succ A&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;footer class=&quot;source&quot;&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../Textbooks/Rosen%20%26%20Gayer%20-%20Public%20Finance%20%2810th%20ed%29.pdf#page=194&quot; title=&quot;R&amp;amp;G “Majority Voting Rules” · PDF pp. 194–198&quot; target=&quot;_blank&quot;&gt;R&amp;amp;G · PDF pp. 194–198&lt;/a&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../study-packs/Upcoming%20lecture%20block/02-political-economy.html&quot; target=&quot;_blank&quot;&gt;Full notes + practice&lt;/a&gt;&lt;/footer&gt;&lt;/section&gt;&lt;div class=&quot;progress&quot; data-layout-ignore&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;scene&quot; id=&quot;politics-7&quot; data-composition-id=&quot;politics-7&quot; data-start=&quot;60&quot; data-duration=&quot;10&quot; data-width=&quot;1920&quot; data-height=&quot;1080&quot; data-label=&quot;Logrolling reveals preference intensity but may impose costs on outsiders.&quot;&gt;
&lt;section id=&quot;politics-7-content&quot; class=&quot;slide clip&quot; data-start=&quot;60&quot; data-duration=&quot;10&quot; data-track-index=&quot;7&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;Collective decision-making · 7/13&lt;/p&gt;&lt;h1&gt;Logrolling reveals preference intensity but may impose costs on outsiders.&lt;/h1&gt;
&lt;div class=&quot;content plain &quot;&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;Voters trade support for separate proposals. A person can support a less-valued proposal to secure a strongly valued one.&lt;/p&gt;&lt;p&gt;The resulting package can be beneficial or harmful. Compare total benefits and costs, including people outside the bargain.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;footer class=&quot;source&quot;&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../Textbooks/Rosen%20%26%20Gayer%20-%20Public%20Finance%20%2810th%20ed%29.pdf#page=200&quot; title=&quot;R&amp;amp;G “Logrolling” · PDF pp. 200–202&quot; target=&quot;_blank&quot;&gt;R&amp;amp;G · PDF pp. 200–202&lt;/a&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../study-packs/Upcoming%20lecture%20block/02-political-economy.html&quot; target=&quot;_blank&quot;&gt;Full notes + practice&lt;/a&gt;&lt;/footer&gt;&lt;/section&gt;&lt;div class=&quot;progress&quot; data-layout-ignore&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;scene&quot; id=&quot;politics-8&quot; data-composition-id=&quot;politics-8&quot; data-start=&quot;70&quot; data-duration=&quot;10&quot; data-width=&quot;1920&quot; data-height=&quot;1080&quot; data-label=&quot;Arrow’s result explains why no voting rule has every desirable property.&quot;&gt;
&lt;section id=&quot;politics-8-content&quot; class=&quot;slide clip&quot; data-start=&quot;70&quot; data-duration=&quot;10&quot; data-track-index=&quot;8&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;Collective decision-making · 8/13&lt;/p&gt;&lt;h1&gt;Arrow’s result explains why no voting rule has every desirable property.&lt;/h1&gt;
&lt;div class=&quot;content plain &quot;&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;With at least three alternatives, unrestricted preferences, complete/transitive social rankings, unanimity, independence of irrelevant alternatives and no dictator cannot all be guaranteed.&lt;/p&gt;&lt;p&gt;Single-peakedness restricts the preference domain. It avoids a particular difficulty without disproving the impossibility result.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;footer class=&quot;source&quot;&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../Textbooks/Rosen%20%26%20Gayer%20-%20Public%20Finance%20%2810th%20ed%29.pdf#page=202&quot; title=&quot;R&amp;amp;G “Arrow’s Impossibility Theorem” · PDF pp. 202–204&quot; target=&quot;_blank&quot;&gt;R&amp;amp;G · PDF pp. 202–204&lt;/a&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../study-packs/Upcoming%20lecture%20block/02-political-economy.html&quot; target=&quot;_blank&quot;&gt;Full notes + practice&lt;/a&gt;&lt;/footer&gt;&lt;/section&gt;&lt;div class=&quot;progress&quot; data-layout-ignore&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;scene&quot; id=&quot;politics-9&quot; data-composition-id=&quot;politics-9&quot; data-start=&quot;80&quot; data-duration=&quot;10&quot; data-width=&quot;1920&quot; data-height=&quot;1080&quot; data-label=&quot;Electoral competition can move candidates toward the median.&quot;&gt;
&lt;section id=&quot;politics-9-content&quot; class=&quot;slide clip&quot; data-start=&quot;80&quot; data-duration=&quot;10&quot; data-track-index=&quot;9&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;Collective decision-making · 9/13&lt;/p&gt;&lt;h1&gt;Electoral competition can move candidates toward the median.&lt;/h1&gt;
&lt;div class=&quot;content plain &quot;&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;Two candidates who maximise votes may converge when voters choose the closer platform.&lt;/p&gt;&lt;p&gt;Multiple dimensions, turnout, ideology and candidate credibility limit this prediction. The benchmark is a conditional explanation.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;footer class=&quot;source&quot;&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../Textbooks/Rosen%20%26%20Gayer%20-%20Public%20Finance%20%2810th%20ed%29.pdf#page=204&quot; title=&quot;R&amp;amp;G “Representative Democracy: Elected Politicians” · PDF pp. 204–208&quot; target=&quot;_blank&quot;&gt;R&amp;amp;G · PDF pp. 204–208&lt;/a&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../study-packs/Upcoming%20lecture%20block/02-political-economy.html&quot; target=&quot;_blank&quot;&gt;Full notes + practice&lt;/a&gt;&lt;/footer&gt;&lt;/section&gt;&lt;div class=&quot;progress&quot; data-layout-ignore&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;scene&quot; id=&quot;politics-10&quot; data-composition-id=&quot;politics-10&quot; data-start=&quot;90&quot; data-duration=&quot;10&quot; data-width=&quot;1920&quot; data-height=&quot;1080&quot; data-label=&quot;Public employees’ implementation discretion can influence spending.&quot;&gt;
&lt;section id=&quot;politics-10-content&quot; class=&quot;slide clip&quot; data-start=&quot;90&quot; data-duration=&quot;10&quot; data-track-index=&quot;10&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;Collective decision-making · 10/13&lt;/p&gt;&lt;h1&gt;Public employees’ implementation discretion can influence spending.&lt;/h1&gt;
&lt;div class=&quot;content plain &quot;&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;Officials supply useful expertise and institutional memory. Vague legislation also gives them discretion over policy design and implementation.&lt;/p&gt;&lt;p&gt;If officials value reputation, power or patronage, their preferred spending may exceed the level where marginal social benefit equals marginal cost. This is a conditional mechanism, not a claim about every bureau.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;footer class=&quot;source&quot;&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../Textbooks/Rosen%20%26%20Gayer%20-%20Public%20Finance%20%2810th%20ed%29.pdf#page=208&quot; title=&quot;R&amp;amp;G “Public Employees” · PDF pp. 208–209&quot; target=&quot;_blank&quot;&gt;R&amp;amp;G · PDF pp. 208–209&lt;/a&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../study-packs/Upcoming%20lecture%20block/02-political-economy.html&quot; target=&quot;_blank&quot;&gt;Full notes + practice&lt;/a&gt;&lt;/footer&gt;&lt;/section&gt;&lt;div class=&quot;progress&quot; data-layout-ignore&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;scene&quot; id=&quot;politics-11&quot; data-composition-id=&quot;politics-11&quot; data-start=&quot;100&quot; data-duration=&quot;10&quot; data-width=&quot;1920&quot; data-height=&quot;1080&quot; data-label=&quot;Small organised groups can have stronger lobbying incentives than dispersed taxpayers.&quot;&gt;
&lt;section id=&quot;politics-11-content&quot; class=&quot;slide clip&quot; data-start=&quot;100&quot; data-duration=&quot;10&quot; data-track-index=&quot;11&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;Collective decision-making · 11/13&lt;/p&gt;&lt;h1&gt;Small organised groups can have stronger lobbying incentives than dispersed taxpayers.&lt;/h1&gt;
&lt;div class=&quot;content plain &quot;&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;Concentrated benefits make participation worthwhile for each beneficiary. Small individual losses make opposition less worthwhile.&lt;/p&gt;&lt;p&gt;Seeking transfers can consume real resources. Explain the incentive and the resource loss instead of treating every policy disagreement as corruption.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;footer class=&quot;source&quot;&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../Textbooks/Rosen%20%26%20Gayer%20-%20Public%20Finance%20%2810th%20ed%29.pdf#page=209&quot; title=&quot;R&amp;amp;G “Special Interests”; “Rent-Seeking” · PDF pp. 209–214&quot; target=&quot;_blank&quot;&gt;R&amp;amp;G &lt;/a&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../study-packs/Upcoming%20lecture%20block/02-political-economy.html&quot; target=&quot;_blank&quot;&gt;Full notes + practice&lt;/a&gt;&lt;/footer&gt;&lt;/section&gt;&lt;div class=&quot;progress&quot; data-layout-ignore&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;scene&quot; id=&quot;politics-12&quot; data-composition-id=&quot;politics-12&quot; data-start=&quot;110&quot; data-duration=&quot;10&quot; data-width=&quot;1920&quot; data-height=&quot;1080&quot; data-label=&quot;Government growth has competing explanations with different implications.&quot;&gt;
&lt;section id=&quot;politics-12-content&quot; class=&quot;slide clip&quot; data-start=&quot;110&quot; data-duration=&quot;10&quot; data-track-index=&quot;12&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;Collective decision-making · 12/13&lt;/p&gt;&lt;h1&gt;Government growth has competing explanations with different implications.&lt;/h1&gt;
&lt;div class=&quot;content plain &quot;&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;Rising income and service prices, crises followed by inertia, and redistributive voting incentives are distinct mechanisms. No single theory explains all government growth.&lt;/p&gt;&lt;p&gt;A positive answer must apply an actual mechanism to the scenario. A normative answer must state the welfare reason separately.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;footer class=&quot;source&quot;&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../Textbooks/Rosen%20%26%20Gayer%20-%20Public%20Finance%20%2810th%20ed%29.pdf#page=215&quot; title=&quot;R&amp;amp;G “Explaining Government Growth” · PDF pp. 215–219&quot; target=&quot;_blank&quot;&gt;R&amp;amp;G · PDF pp. 215–219&lt;/a&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../study-packs/Upcoming%20lecture%20block/02-political-economy.html&quot; target=&quot;_blank&quot;&gt;Full notes + practice&lt;/a&gt;&lt;/footer&gt;&lt;/section&gt;&lt;div class=&quot;progress&quot; data-layout-ignore&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;scene&quot; id=&quot;politics-13&quot; data-composition-id=&quot;politics-13&quot; data-start=&quot;120&quot; data-duration=&quot;10&quot; data-width=&quot;1920&quot; data-height=&quot;1080&quot; data-label=&quot;The voting exam requires both the peak calculation and the median argument.&quot;&gt;
&lt;section id=&quot;politics-13-content&quot; class=&quot;slide clip&quot; data-start=&quot;120&quot; data-duration=&quot;10&quot; data-track-index=&quot;13&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;Collective decision-making · 13/13&lt;/p&gt;&lt;h1&gt;The voting exam requires both the peak calculation and the median argument.&lt;/h1&gt;
&lt;div class=&quot;content plain &quot;&gt;&lt;div class=&quot;prose&quot;&gt;&lt;p&gt;F24 Q8a–b gives two marks in total: calculate a voter’s peak and establish single-peakedness, then identify the median.&lt;/p&gt;&lt;p&gt;F25 Q8 tests the distinction between a normative reason and a positive explanation. Use the attempt-first section in the notes.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;footer class=&quot;source&quot;&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../Past%20exams/Finals/2024-10%20Final%20%28with%20solutions%29.pdf#page=13&quot; title=&quot;F24 Q8 · PDF p. 13; F25 Q8 · PDF p. 15&quot; target=&quot;_blank&quot;&gt;F24 Q8 · PDF p. 13&lt;/a&gt;&lt;a href=&quot;#&quot; data-source=&quot;../../../../../study-packs/Upcoming%20lecture%20block/02-political-economy.html&quot; target=&quot;_blank&quot;&gt;Full notes + practice&lt;/a&gt;&lt;/footer&gt;&lt;/section&gt;&lt;div class=&quot;progress&quot; data-layout-ignore&gt;&lt;/div&gt;&lt;/div&gt;&lt;script&gt;/* Deterministic seek states. Graph inputs are deliberately user-owned, not animated. */
(()=&gt;{const scenes=[...document.querySelectorAll(&#x27;.scene&#x27;)], manifest=JSON.parse(document.querySelector(&#x27;script[type=&quot;application/hyperframes-slideshow+json&quot;]&#x27;).textContent), total=scenes.length*10;window.__timelines=window.__timelines||{};

scenes.slice(1).forEach(s=&gt;{let tl=gsap.timeline({paused:true});tl.set(s.querySelector(&#x27;h1&#x27;),{opacity:1},0);window.__timelines[s.dataset.compositionId]=tl;});window.__hfSetTime=state;window.studySeek=t=&gt;{root.seek(t);state(t)};state(.8);

if(parent!==window)parent.postMessage({source:&#x27;hf-preview&#x27;,type:&#x27;timeline&#x27;,durationInFrames:total*30,scenes:scenes.map((s,i)=&gt;({id:s.dataset.compositionId,start:i*10,duration:10}))},&#x27;*&#x27;);
window.studyDeck={manifest,scenes:scenes.map((s,i)=&gt;({id:s.dataset.compositionId,start:i*10,end:(i+1)*10})),seek:window.studySeek};

&lt;/script&gt;&lt;script&gt;/* All graph numbers below are constructed teaching examples. SVG axes stay fixed.
   Sliders are native keyboard controls; probability/median points also support dragging. */
(()=&gt;{const NS=&#x27;http://www.w3.org/2000/svg&#x27;, colors=[&#x27;#076760&#x27;,&#x27;#365faf&#x27;,&#x27;#945209&#x27;];
const specs={
 &#x27;tax-wedge&#x27;:{axes:[&#x27;Quantity q&#x27;,&#x27;Price p (€)&#x27;],range:[0,110,0,30],controls:[[&#x27;u&#x27;,&#x27;Unit tax u&#x27;,0,8,.1,2]],legend:&#x27;Teal: demand · blue: supply · gold: lost-surplus triangle&#x27;,draw(v){let q=60-4*v.u;return {lines:[x=&gt;25-x/4,x=&gt;10],points:[[q,10+v.u]],shade:[[q,10],[q,10+v.u],[60,10]],text:`u = ${v.u.toFixed(1)}; q = ${q.toFixed(1)}; revenue = ${(v.u*q).toFixed(1)}; excess burden = ${(2*v.u*v.u).toFixed(1)}`};}},
 &#x27;ramsey&#x27;:{axes:[&#x27;Good X rate τₓ&#x27;,&#x27;Good Y rate τᵧ&#x27;],range:[0,.2,0,.2],controls:[[&#x27;ex&#x27;,&#x27;Elasticity εₓ&#x27;,.4,2,.1,.5],[&#x27;ey&#x27;,&#x27;Elasticity εᵧ&#x27;,.4,2,.1,1.5]],legend:&#x27;Teal: marginal losses · blue: revenue&#x27;,draw(v){let x=.1*v.ey/(v.ex+v.ey),y=.1-x;return {lines:[a=&gt;v.ex*a/v.ey,a=&gt;.1-a],points:[[x,y]],text:`τₓ ${x.toFixed(3)} · τᵧ ${y.toFixed(3)} · revenue ≈ 10`};}},
